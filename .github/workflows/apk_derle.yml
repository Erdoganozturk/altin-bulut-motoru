name: Android APK Derle

on:
  workflow_dispatch:

jobs:
  apk-olustur:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Sistem Paketlerini Kur
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flet Yukle ve APK Derle
        run: |
          pip install --upgrade pip
          pip install "flet[all]"
          flet build apk --project "GramAltinPro" --org "com.erdogan.altin" -v

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: GramAltinPro-APK
          path: build/apk/*.apk
