name: Android APK Derle

on:
  workflow_dispatch:

jobs:
  apk-olustur:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flet Yukle ve APK Derle
        run: |
          pip install flet
          flet build apk --project "GramAltinPro" --org "com.erdogan.altin"

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: GramAltinPro-APK
          path: build/apk/*.apk
